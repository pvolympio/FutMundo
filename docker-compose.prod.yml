version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: futfut-db-prod
    environment:
      POSTGRES_USER: futfut
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: futfut
    volumes:
      - db_prod_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    # Banco de dados não expõe portas públicas em produção (apenas rede interna)
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futfut -d futfut"]
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - db_password
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: futfut-api-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexão da API usando o papel somente leitura de produção
      DATABASE_URL: postgresql://app_reader:${DB_READER_PASSWORD:-app_reader_secret}@db:5432/futfut
      DATABASE_POOL_MIN_SIZE: 5
      DATABASE_POOL_MAX_SIZE: 20
      DEBUG: false
      PROJECT_NAME: FutMundo API
      CORS_ORIGINS: https://cartatatica.com,https://www.cartatatica.com
    # API interna na rede docker, acessada exclusivamente via Nginx (/api/)
    # ports:
    #   - "127.0.0.1:8000:8000"
    secrets:
      - db_password
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: futfut-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  db_prod_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt