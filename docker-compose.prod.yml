version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: futfut-db-prod
    environment:
      POSTGRES_USER: futfut
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: futfut
    volumes:
      - db_prod_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futfut -d futfut"]
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - db_password
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: futfut-api-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://futfut:${DB_PASSWORD}@db:5432/futfut
      DATABASE_POOL_MIN_SIZE: 5
      DATABASE_POOL_MAX_SIZE: 20
      DEBUG: false
      PROJECT_NAME: FUTFUT API
      CORS_ORIGINS: https://cartatatica.com,https://www.cartatatica.com
    ports:
      - "8000:8000"
    secrets:
      - db_password
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  nginx:
    image: nginx:alpine
    container_name: futfut-nginx
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    deploy:
      restart_policy:
        condition: on-failure

  frontend:
    image: node:20-alpine
    container_name: futfut-frontend-prod
    working_dir: /app
    environment:
      - NODE_ENV=production
    command: sh -c "npm ci && npm run build && npx serve -s dist -l 3001"
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
          cpus: '0.1'

volumes:
  db_prod_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt