name: FutMundo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: futfut
          POSTGRES_USER: futfut
          POSTGRES_PASSWORD: futfut_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Initialize PostgreSQL Database Schema, Migrations & Seed
        env:
          PGPASSWORD: futfut_secret
        run: |
          psql -h localhost -U futfut -d futfut -f backend/schema.sql
          psql -h localhost -U futfut -d futfut -f backend/seed.sql
          python -m backend.migrations.runner migrate

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://futfut:futfut_secret@localhost:5432/futfut
          DEBUG: true
        run: |
          pytest tests/ -v

  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        working-directory: frontend
        run: npx vitest run

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
