version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: futfut-db-dev
    environment:
      POSTGRES_USER: futfut
      POSTGRES_PASSWORD: futfut_dev_password
      POSTGRES_DB: futfut_dev
    volumes:
      - db_dev_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futfut -d futfut_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: futfut-api-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://futfut:futfut_dev_password@db:5432/futfut_dev
      DATABASE_POOL_MIN_SIZE: 2
      DATABASE_POOL_MAX_SIZE: 10
      DEBUG: true
      PROJECT_NAME: FUTFUT API Dev
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
    volumes:
      - ./backend:/app/backend
      - ./api:/app/api
    ports:
      - "8000:8000"
    command: >
      bash -c "sleep 10 && uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: futfut-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: npm run dev
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_dev_data: