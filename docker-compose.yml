services:
  db:
    image: postgres:16
    container_name: futebol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: futebol
      POSTGRES_DB: futebol
    ports:
      - "127.0.0.1:5432:5432"   # só acessível da sua máquina
    volumes:
      - dados:/var/lib/postgresql/data
      # roda uma única vez, na primeira criação do volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  dados:
